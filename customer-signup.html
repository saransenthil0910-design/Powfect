<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Powfect </title>

    <link rel="icon" href="Images/company logo.jpeg">

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            background:
                linear-gradient(rgba(88, 48, 28, 0.25), rgba(88, 48, 28, 0.25)),
                #f9ede7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        /* PAW DECORATION */

        .paw {
            position: fixed;
            color: rgba(139, 69, 19, 0.08);
            font-size: 80px;
            z-index: 0;
        }

        .paw1 {
            top: 8%;
            left: 7%;
            transform: rotate(-25deg);
        }

        .paw2 {
            bottom: 8%;
            right: 7%;
            transform: rotate(25deg);
        }

        /* MAIN CARD */

        .signup-container {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(77, 42, 24, 0.18);
            position: relative;
            z-index: 2;
        }

        /* LOGO */

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            background: #8b4513;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 28px;
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.25);
        }

        .logo h1 {
            font-family: "Playfair Display", serif;
            color: #5a301d;
            font-size: 30px;
            margin-top: 12px;
        }

        .logo p {
            color: #8b6b5a;
            font-size: 13px;
            margin-top: 4px;
        }

        /* HEADING */

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .heading h2 {
            color: #4d2919;
            font-family: "Playfair Display", serif;
            font-size: 27px;
        }

        .heading p {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            color: #59331f;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a66a42;
            font-size: 15px;
        }

        .input-box input,
        .input-box textarea {
            width: 100%;
            border: 1px solid #ead7cc;
            background: #fffaf7;
            border-radius: 12px;
            padding: 13px 15px 13px 43px;
            outline: none;
            font-family: "Poppins", sans-serif;
            font-size: 13px;
            color: #4d2919;
            transition: 0.3s;
        }

        .input-box textarea {
            min-height: 80px;
            resize: vertical;
            padding-top: 13px;
        }

        .input-box input:focus,
        .input-box textarea:focus {
            border-color: #a65f35;
            box-shadow: 0 0 0 3px rgba(166, 95, 53, 0.08);
            background: white;
        }

        /* PASSWORD EYE */

        .password-box input {
            padding-right: 45px;
        }

        .password-box .eye {
            left: auto;
            right: 15px;
            cursor: pointer;
            color: #8b6b5a;
        }

        /* BUTTON */

        .signup-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 13px;
            background: linear-gradient(135deg, #8b4513, #a85f32);
            color: white;
            font-family: "Poppins", sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.2);
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(139, 69, 19, 0.28);
        }

        /* MESSAGE */

        .message {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #c0392b;
            border: 1px solid #f2c2c2;
        }

        .message.success {
            display: block;
            background: #effaf1;
            color: #27833a;
            border: 1px solid #bce5c4;
        }

        /* LOGIN */

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #777;
        }

        .login-link a {
            color: #8b4513;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* ADMIN */

        .admin-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #eee0d8;
        }

        .admin-link p {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .admin-link a {
            color: #8b4513;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .signup-container {
                padding: 28px 22px;
                border-radius: 22px;
            }

            .logo h1 {
                font-size: 26px;
            }

            .heading h2 {
                font-size: 23px;
            }

            .paw {
                display: none;
            }
        }

    </style>
</head>

<body>

    <!-- DECORATIVE PAWS -->

    <i class="fa-solid fa-paw paw paw1"></i>
    <i class="fa-solid fa-paw paw paw2"></i>


    <div class="signup-container">

        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-paw"></i>
            </div>

            <h1>Powfect</h1>

            <p>Care Clinic</p>

        </div>


        <!-- HEADING -->

        <div class="heading">

            <h2>Create Your Account</h2>

            <p>Join the Powfect family and care for your pet better.</p>

        </div>


        <!-- MESSAGE -->

        <div id="message" class="message"></div>


        <!-- SIGNUP FORM -->

        <form id="signupForm">

            <!-- NAME -->

            <div class="form-group">

                <label for="name">Full Name</label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">Email Address</label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">Mobile Number</label>

                <div class="input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter your mobile number"
                        maxlength="10"
                        required
                    >

                </div>

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="address">Address</label>

                <div class="input-box">

                    <i class="fa-solid fa-location-dot"></i>

                    <textarea
                        id="address"
                        placeholder="Enter your address"
                        required
                    ></textarea>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">Password</label>

                <div class="input-box password-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                    <i
                        class="fa-solid fa-eye eye"
                        id="passwordEye"
                    ></i>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">Confirm Password</label>

                <div class="input-box password-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                    <i
                        class="fa-solid fa-eye eye"
                        id="confirmEye"
                    ></i>

                </div>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="signup-btn"
            >

                <i class="fa-solid fa-user-plus"></i>

                Create Account

            </button>

        </form>


        <!-- LOGIN LINK -->

        <div class="login-link">

            Already have an account?

            <a href="customer-login.html">
                Login
            </a>

        </div>


        <!-- ADMIN LOGIN -->

        <div class="admin-link">

            <p>Are you an administrator?</p>

            <a href="admin-login.html">

                <i class="fa-solid fa-user-shield"></i>

                Admin Login

            </a>

        </div>

    </div>


    <script>

        const signupForm = document.getElementById("signupForm");
        const message = document.getElementById("message");

        /* PASSWORD SHOW / HIDE */

        const passwordEye = document.getElementById("passwordEye");
        const confirmEye = document.getElementById("confirmEye");

        passwordEye.addEventListener("click", () => {

            const password = document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

                passwordEye.classList.remove("fa-eye");
                passwordEye.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                passwordEye.classList.remove("fa-eye-slash");
                passwordEye.classList.add("fa-eye");

            }

        });


        confirmEye.addEventListener("click", () => {

            const confirmPassword =
                document.getElementById("confirmPassword");

            if (confirmPassword.type === "password") {

                confirmPassword.type = "text";

                confirmEye.classList.remove("fa-eye");
                confirmEye.classList.add("fa-eye-slash");

            } else {

                confirmPassword.type = "password";

                confirmEye.classList.remove("fa-eye-slash");
                confirmEye.classList.add("fa-eye");

            }

        });


        /* SIGNUP */

        signupForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const mobile =
                document.getElementById("mobile").value.trim();

            const address =
                document.getElementById("address").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            /* MOBILE VALIDATION */

            if (!/^[0-9]{10}$/.test(mobile)) {

                showMessage(
                    "Please enter a valid 10-digit mobile number.",
                    "error"
                );

                return;
            }


            /* PASSWORD MATCH */

            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            /* PASSWORD LENGTH */

            if (password.length < 6) {

                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }


            /* CHECK EXISTING USER */

            const existingUser =
                JSON.parse(localStorage.getItem("powfectUser"));

            if (
                existingUser &&
                existingUser.email.toLowerCase() === email.toLowerCase()
            ) {

                showMessage(
                    "An account with this email already exists.",
                    "error"
                );

                return;
            }


            /* USER OBJECT */

            const user = {

                name: name,

                email: email,

                mobile: mobile,

                address: address,

                password: password

            };


            /* SAVE USER */

            localStorage.setItem(
                "powfectUser",
                JSON.stringify(user)
            );


            /* SUCCESS */

            showMessage(
                "✅ Account created successfully! Redirecting to login...",
                "success"
            );


            signupForm.reset();


            /* REDIRECT */

            setTimeout(() => {

                window.location.href =
                    "customer-login.html";

            }, 1500);

        });


        /* MESSAGE FUNCTION */

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }

    </script>

</body>

</html>
