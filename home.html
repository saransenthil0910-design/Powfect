<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Powfect </title>


    <!-- =========================
         FAVICON
    ========================= -->

    <link
        rel="icon"
        href="Images/company logo.jpeg"
    >


    <!-- =========================
         FONT AWESOME
    ========================= -->

    <script
        src="https://kit.fontawesome.com/d1f9284067.js"
        crossorigin="anonymous"
    ></script>


    <!-- =========================
         CSS
    ========================= -->

    <style>

        /* =========================
           GLOBAL RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-image:
                url("Images/frontimage.png");

            background-repeat: no-repeat;

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            overflow-x: hidden;
        }


        /* =========================
           MAIN BACKGROUND
        ========================= */

        .background {

            min-height: 100vh;
        }


        /* =========================
           NAVBAR
        ========================= */

        .nav {

            width: 100%;

            padding: 18px 5%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 25px;

            backdrop-filter: blur(10px);

            background:
                rgba(255, 255, 255, 0.12);

            box-shadow:
                0 0 30px
                rgba(199, 102, 0, 0.25);

            position: relative;

            z-index: 100;
        }


        /* =========================
           LEFT AREA
        ========================= */

        .left-area {

            display: flex;

            align-items: center;

            gap: 12px;

            flex-shrink: 0;
        }


        /* =========================
           MOBILE MENU BUTTON
        ========================= */

        .menu-toggle {

            display: none;

            border: none;

            background: transparent;

            color: #3A1E14;

            font-size: 25px;

            cursor: pointer;

            padding: 5px;
        }


        /* =========================
           COMPANY LOGO
        ========================= */

        .companylogo {

            display: flex;

            align-items: center;

            gap: 15px;

            color: #2b8597;

            text-shadow:
                2px 2px 10px #0f414b;

            font-size: 20px;

            flex-shrink: 0;
        }


        .logo img {

            height: 50px;

            width: 50px;

            border-radius: 50%;

            object-fit: cover;

            display: block;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .navhome {

            display: flex;

            align-items: center;

            gap: 28px;
        }


        .nav1 {

            margin: 0;
        }


        .nav1 a {

            position: relative;

            display: inline-block;

            padding: 8px 0;

            text-decoration: none;

            color: #202020;

            font-size: 17px;

            font-weight: 700;

            white-space: nowrap;
        }


        /* =========================
           UNDERLINE EFFECT
        ========================= */

        .nav1 a::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: 0;

            width: 0;

            height: 2px;

            background-color: #b9572d;

            transition:
                width 0.4s ease;
        }


        .nav1 a:hover::after,
        .nav1 a.active::after {

            width: 100%;
        }


        /* ==================================================
           USER PROFILE
        ================================================== */

        .user-profile {

            position: relative;

            flex-shrink: 0;
        }


        /* PROFILE BUTTON */

        .profile-btn {

            border: none;

            background:
                rgba(255, 255, 255, 0.75);

            color: #3A1E14;

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 7px 12px 7px 7px;

            border-radius: 30px;

            font-family: Arial, sans-serif;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 3px 12px
                rgba(90, 45, 20, 0.18);

            transition:
                all 0.3s ease;
        }


        .profile-btn:hover {

            background: #ffffff;

            transform: translateY(-2px);

            box-shadow:
                0 5px 16px
                rgba(90, 45, 20, 0.25);
        }


        /* PROFILE ICON */

        .profile-icon {

            width: 35px;

            height: 35px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #8B4513,
                    #b9572d
                );

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 16px;
        }


        .profile-btn .profile-arrow {

            font-size: 10px;

            margin-left: 2px;

            transition:
                transform 0.3s ease;
        }


        .profile-btn.open
        .profile-arrow {

            transform:
                rotate(180deg);
        }


        /* PROFILE DROPDOWN */

        .profile-dropdown {

            position: absolute;

            top: calc(100% + 14px);

            right: 0;

            width: 310px;

            background: #ffffff;

            border-radius: 18px;

            padding: 18px;

            box-shadow:
                0 15px 45px
                rgba(70, 35, 20, 0.25);

            border:
                1px solid #ead7cc;

            opacity: 0;

            visibility: hidden;

            transform:
                translateY(-10px);

            transition:
                all 0.25s ease;

            z-index: 9999;
        }


        .profile-dropdown.show {

            opacity: 1;

            visibility: visible;

            transform:
                translateY(0);
        }


        /* PROFILE TOP */

        .profile-top {

            display: flex;

            align-items: center;

            gap: 13px;

            padding: 3px;
        }


        .big-profile-icon {

            width: 52px;

            height: 52px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #8B4513,
                    #b9572d
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            flex-shrink: 0;
        }


        .profile-user-name {

            color: #4d2919;

            font-size: 16px;

            font-weight: 700;

            margin-bottom: 3px;

            word-break: break-word;
        }


        .profile-user-email {

            color: #777;

            font-size: 11px;

            word-break: break-all;
        }


        /* DIVIDER */

        .profile-divider {

            width: 100%;

            height: 1px;

            background:
                #eee0d8;

            margin:
                15px 0;
        }


        /* DETAILS */

        .profile-detail {

            display: flex;

            align-items: flex-start;

            gap: 11px;

            color: #594033;

            font-size: 12px;

            line-height: 1.5;

            margin-bottom: 13px;
        }


        .profile-detail i {

            width: 18px;

            color: #a35116;

            font-size: 13px;

            margin-top: 2px;

            flex-shrink: 0;
        }


        .profile-detail span {

            word-break: break-word;
        }


        /* PROFILE MENU */

        .profile-menu {

            width: 100%;

            border: none;

            background: transparent;

            display: flex;

            align-items: center;

            gap: 11px;

            padding: 11px 10px;

            border-radius: 10px;

            color: #4d2919;

            font-family: Arial, sans-serif;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            text-align: left;

            transition:
                all 0.2s ease;
        }


        .profile-menu:hover {

            background:
                #fff3ec;
        }


        .profile-menu i {

            width: 18px;

            color: #a35116;
        }


        /* LOGOUT */

        .logout-btn {

            color: #a13a2c;
        }


        .logout-btn i {

            color: #a13a2c;
        }


        /* =========================
           HERO SECTION
        ========================= */

        .headings {

            padding-top: 55px;

            margin-left: 8%;

            max-width: 650px;
        }


        /* OUR */

        .headings h1 {

            font-size:
                clamp(50px, 6vw, 70px);

            font-family: cursive;

            color: #8B4513;

            margin: 0;
        }


        /* SERVICES */

        .headings h3 {

            font-size:
                clamp(35px, 4.5vw, 50px);

            margin-left: 35px;

            color: #3A1E14;

            font-family: cursive;
        }


        /* MAIN HEADING */

        .headings h2 {

            margin-top: 10px;

            color: #333333;

            font-size:
                clamp(20px, 2.2vw, 28px);

            line-height: 1.5;

            font-weight: 600;
        }


        /* HIGHLIGHT TEXT */

        .headings h2 span {

            color: #8B4513;
        }


        /* =========================
           SERVICES
        ========================= */

        .box {

            margin-top: 55px;

            margin-left: 5%;

            display: flex;

            gap: 20px;

            flex-wrap: wrap;

            max-width: 850px;
        }


        .box a {

            text-decoration: none;
        }


        /* =========================
           SERVICE CARD
        ========================= */

        .b1 {

            min-width: 150px;

            min-height: 145px;

            padding: 25px 20px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 15px;

            border-radius: 16px;

            box-shadow:
                2px 2px 10px
                rgba(128, 128, 128, 0.6);

            border: none;

            font-size: 32px;

            cursor: pointer;

            transition:
                all 0.3s ease;

            color: #3A1E14;

            background:
                rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(5px);
        }


        /* =========================
           SERVICE CARD HOVER
        ========================= */

        .b1:hover {

            transform:
                translateY(-8px)
                scale(1.03);

            color: #ffffff;

            background-color: #a35116;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.25);
        }


        /* =========================
           SERVICE NAME
        ========================= */

        .put {

            font-size: 16px;

            font-weight: 600;

            text-align: center;
        }


        /* =========================
           EXPLORE PRODUCTS BUTTON
        ========================= */

        .button {

            margin-top: 50px;

            margin-left: 8%;

            padding-bottom: 50px;
        }


        .button a {

            text-decoration: none;
        }


        .button button {

            width: 300px;

            max-width: 90%;

            height: 52px;

            padding: 0 20px;

            border: none;

            background-color: #a35116;

            color: #ffffff;

            font-size: 16px;

            font-weight: 600;

            border-radius: 10px;

            box-shadow:
                2px 2px 10px
                rgba(255, 255, 255, 0.8);

            cursor: pointer;

            transition:
                all 0.3s ease;
        }


        /* =========================
           BUTTON HOVER
        ========================= */

        .button button:hover {

            transform: scale(1.05);

            background-color: #8b4513;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.3);
        }


        /* =========================
           TABLET RESPONSIVE
           768px - 1023px
        ========================= */

        @media (max-width: 1023px) {


            .nav {

                padding: 16px 4%;

                gap: 15px;
            }


            .navhome {

                gap: 18px;

                flex-wrap: wrap;

                justify-content: center;
            }


            .headings {

                margin-left: 6%;

                padding-top: 45px;

                max-width: 600px;
            }


            .box {

                margin-left: 6%;

                margin-right: 5%;

                gap: 18px;
            }


            .b1 {

                min-width: 140px;

                min-height: 135px;
            }


            .button {

                margin-left: 6%;
            }


            .profile-btn {

                padding:
                    6px 9px 6px 6px;

                font-size: 12px;
            }


            .profile-icon {

                width: 32px;

                height: 32px;

                font-size: 14px;
            }

        }


        /* =========================
           MOBILE
           max-width: 767px
        ========================= */

        @media (max-width: 767px) {


            body {

                background-position: center;

                background-attachment: scroll;
            }


            /* =========================
               MOBILE NAVBAR
            ========================= */

            .nav {

                padding:
                    12px 5%;

                flex-direction: row;

                justify-content:
                    space-between;

                align-items: center;

                gap: 8px;
            }


            /* LEFT AREA */

            .left-area {

                gap: 7px;

                min-width: 0;
            }


            /* HAMBURGER */

            .menu-toggle {

                display: block;

                flex-shrink: 0;
            }


            /* LOGO */

            .companylogo {

                gap: 8px;

                font-size: 17px;
            }


            .logo img {

                width: 40px;

                height: 40px;
            }


            /* =========================
               MOBILE PROFILE
            ========================= */

            .user-profile {

                margin-left: auto;

                flex-shrink: 0;
            }


            .profile-btn {

                padding: 5px;

                width: 38px;

                height: 38px;

                border-radius: 50%;

                justify-content: center;
            }


            .profile-btn span {

                display: none;
            }


            .profile-btn .profile-arrow {

                display: none;
            }


            .profile-icon {

                width: 28px;

                height: 28px;

                font-size: 13px;
            }


            /* =========================
               MOBILE NAVIGATION
            ========================= */

            .navhome {

                display: none;

                position: absolute;

                top: 100%;

                left: 0;

                width: 100%;

                padding:
                    12px 5%;

                flex-direction: column;

                align-items: flex-start;

                gap: 0;

                background:
                    rgba(255, 255, 255, 0.96);

                backdrop-filter: blur(10px);

                box-shadow:
                    0 8px 20px
                    rgba(0, 0, 0, 0.15);
            }


            .navhome.active {

                display: flex;
            }


            .nav1 {

                width: 100%;
            }


            .nav1 a {

                display: block;

                width: 100%;

                padding:
                    12px 5px;

                font-size: 15px;
            }


            /* =========================
               PROFILE DROPDOWN MOBILE
            ========================= */

            .profile-dropdown {

                position: fixed;

                top: 70px;

                right: 12px;

                width:
                    calc(100% - 24px);

                max-width: 320px;
            }


            /* =========================
               HERO
            ========================= */

            .headings {

                margin-left: 0;

                padding:
                    45px 6% 0;

                max-width: 100%;

                text-align: center;
            }


            .headings h1 {

                font-size: 48px;
            }


            .headings h3 {

                font-size: 36px;

                margin-left: 0;

                margin-top: 5px;
            }


            .headings h2 {

                margin-top: 15px;

                font-size: 20px;

                line-height: 1.5;
            }


            /* =========================
               SERVICES
            ========================= */

            .box {

                margin:
                    40px auto 0;

                padding:
                    0 5%;

                width: 100%;

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 15px;
            }


            .b1 {

                width: 100%;

                min-width: 0;

                min-height: 130px;

                padding:
                    20px 10px;

                font-size: 28px;

                border-radius: 14px;
            }


            .put {

                font-size: 14px;
            }


            /* =========================
               EXPLORE BUTTON
            ========================= */

            .button {

                margin:
                    40px auto 0;

                padding:
                    0 5% 40px;

                text-align: center;
            }


            .button button {

                width: 100%;

                max-width: 320px;

                height: 50px;

                font-size: 15px;
            }

        }


        /* =========================
           SMALL MOBILE
           max-width: 480px
        ========================= */

        @media (max-width: 480px) {


            .nav {

                padding:
                    11px 4%;
            }


            .left-area {

                gap: 5px;
            }


            .companylogo {

                gap: 7px;

                font-size: 16px;
            }


            .logo img {

                width: 38px;

                height: 38px;
            }


            .menu-toggle {

                font-size: 23px;
            }


            .navhome {

                padding:
                    12px 4%;
            }


            .nav1 a {

                font-size: 14px;
            }


            .headings {

                padding-top: 35px;
            }


            .headings h1 {

                font-size: 42px;
            }


            .headings h3 {

                font-size: 32px;
            }


            .headings h2 {

                font-size: 18px;
            }


            .box {

                grid-template-columns:
                    1fr 1fr;

                gap: 12px;
            }


            .b1 {

                min-height: 120px;

                padding:
                    15px 8px;

                font-size: 24px;
            }


            .put {

                font-size: 13px;
            }


            .profile-dropdown {

                right: 8px;

                width:
                    calc(100% - 16px);
            }

        }


        /* =========================
           VERY SMALL DEVICES
           max-width: 360px
        ========================= */

        @media (max-width: 360px) {


            .companylogo {

                font-size: 14px;
            }


            .logo img {

                width: 35px;

                height: 35px;
            }


            .menu-toggle {

                font-size: 21px;
            }


            .headings h1 {

                font-size: 38px;
            }


            .headings h3 {

                font-size: 28px;
            }


            .headings h2 {

                font-size: 16px;
            }


            .b1 {

                min-height: 110px;

                font-size: 22px;
            }


            .put {

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         MAIN
    ========================= -->

    <header class="background">


        <!-- =========================
             NAVBAR
        ========================= -->

        <nav class="nav">


            <!-- =========================
                 LEFT AREA
            ========================= -->

            <div class="left-area">


                <!-- MOBILE MENU -->

                <button
                    type="button"
                    class="menu-toggle"
                    id="menuToggle"
                    aria-label="Open Menu"
                >

                    <i class="fa-solid fa-bars"></i>

                </button>


                <!-- COMPANY LOGO -->

                <div class="companylogo">


                    <div class="logo">

                        <img
                            src="Images/company logo.jpeg"
                            alt="Powfect Logo"
                        >

                    </div>


                    <div class="company">

                        <h2>
                            POWFECT
                        </h2>

                    </div>


                </div>

            </div>


            <!-- =========================
                 NAVIGATION LINKS
            ========================= -->

            <div
                class="navhome"
                id="navLinks"
            >


                <div class="nav1">

                    <a
                        href="home.html"
                        class="active"
                    >
                        Home
                    </a>

                </div>


                <div class="nav1">

                    <a href="products.html">
                        Products
                    </a>

                </div>


                <div class="nav1">

                    <a href="Blog.html">
                        Blogs
                    </a>

                </div>


                <div class="nav1">

                    <a href="about.html">
                        About Us
                    </a>

                </div>


                <div class="nav1">

                    <a href="contact.html">
                        Contact
                    </a>

                </div>


                <div class="nav1">

                    <a href="my-orders.html">
                        My Orders
                    </a>

                </div>


            </div>


            <!-- =========================
                 USER PROFILE
            ========================= -->

            <div
                class="user-profile"
                id="userProfile"
            >

                <button
                    type="button"
                    class="profile-btn"
                    id="profileBtn"
                    aria-label="Open User Profile"
                >

                    <span class="profile-icon">

                        <i class="fa-solid fa-user"></i>

                    </span>


                    <span id="profileName">
                        Profile
                    </span>


                    <i
                        class="fa-solid fa-chevron-down profile-arrow"
                    ></i>

                </button>


                <!-- =========================
                     PROFILE DROPDOWN
                ========================= -->

                <div
                    class="profile-dropdown"
                    id="profileDropdown"
                >


                    <!-- PROFILE HEADER -->

                    <div class="profile-top">


                        <div class="big-profile-icon">

                            <i class="fa-solid fa-user"></i>

                        </div>


                        <div>

                            <div
                                class="profile-user-name"
                                id="userName"
                            >
                                User
                            </div>


                            <div
                                class="profile-user-email"
                                id="userEmail"
                            >
                                Email
                            </div>

                        </div>

                    </div>


                    <!-- DIVIDER -->

                    <div class="profile-divider"></div>


                    <!-- MOBILE -->

                    <div class="profile-detail">

                        <i class="fa-solid fa-phone"></i>

                        <span id="userMobile">
                            Mobile Number
                        </span>

                    </div>


                    <!-- ADDRESS -->

                    <div class="profile-detail">

                        <i class="fa-solid fa-location-dot"></i>

                        <span id="userAddress">
                            Address
                        </span>

                    </div>


                    <!-- DIVIDER -->

                    <div class="profile-divider"></div>


                    <!-- EDIT PROFILE -->

                    <a
                        href="profile.html"
                        class="profile-menu"
                    >

                        <i
                            class="fa-solid fa-user-pen"
                        ></i>

                        Edit Profile

                    </a>


                    <!-- MY ORDERS -->

                    <a
                        href="my-orders.html"
                        class="profile-menu"
                    >

                        <i
                            class="fa-solid fa-bag-shopping"
                        ></i>

                        My Orders

                    </a>


                    <!-- LOGOUT -->

                    <button
                        type="button"
                        class="profile-menu logout-btn"
                        id="logoutBtn"
                    >

                        <i
                            class="fa-solid fa-right-from-bracket"
                        ></i>

                        Logout

                    </button>


                </div>

            </div>


        </nav>


        <!-- =========================
             HERO SECTION
        ========================= -->

        <section class="headings">


            <h1>
                Our
            </h1>


            <h3>
                Services
            </h3>


            <h2>

                Provide

                <span>
                    Love, Care
                </span>

                &

                <span>
                    Comfort
                </span>

                <br>
                for Your Beloved

                <span>
                    Pets..!!
                </span>

            </h2>


        </section>


        <!-- =========================
             SERVICES
        ========================= -->

        <section class="box">


            <!-- PET CARE -->

            <a href="pet.html">

                <div class="b1">

                    <i
                        class="fa-solid fa-paw"
                    ></i>


                    <span class="put">

                        Pet Care

                    </span>

                </div>

            </a>


            <!-- ADOPTION -->

            <a href="adoption.html">

                <div class="b1">

                    <i
                        class="fa-solid fa-house-circle-check"
                    ></i>


                    <span class="put">

                        Adoption

                    </span>

                </div>

            </a>


            <!-- VETERINARY -->

            <a href="veterinary.html">

                <div class="b1">

                    <i
                        class="fa-solid fa-hand-holding-medical"
                    ></i>


                    <span class="put">

                        Veterinary

                    </span>

                </div>

            </a>


            <!-- TRAINING -->

            <a href="training.html">

                <div class="b1">

                    <i
                        class="fa-solid fa-shield-dog"
                    ></i>


                    <span class="put">

                        Training

                    </span>

                </div>

            </a>


        </section>


        <!-- =========================
             EXPLORE PRODUCTS
        ========================= -->

        <div class="button">


            <a href="products.html">


                <button type="button">

                    Explore Products

                    <span>
                        →
                    </span>

                </button>


            </a>


        </div>


    </header>


    <!-- =========================
         EXISTING HOME JS
    ========================= -->

    <script src="home.js"></script>


    <!-- =========================
         USER PROFILE JAVASCRIPT
    ========================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =========================
                   GET PROFILE ELEMENTS
                ========================= */

                const userProfile =
                    document.getElementById(
                        "userProfile"
                    );


                const profileBtn =
                    document.getElementById(
                        "profileBtn"
                    );


                const profileDropdown =
                    document.getElementById(
                        "profileDropdown"
                    );


                const profileName =
                    document.getElementById(
                        "profileName"
                    );


                const userName =
                    document.getElementById(
                        "userName"
                    );


                const userEmail =
                    document.getElementById(
                        "userEmail"
                    );


                const userMobile =
                    document.getElementById(
                        "userMobile"
                    );


                const userAddress =
                    document.getElementById(
                        "userAddress"
                    );


                const logoutBtn =
                    document.getElementById(
                        "logoutBtn"
                    );


                /* =========================
                   GET SAVED USER
                ========================= */

                const user =
                    JSON.parse(
                        localStorage.getItem(
                            "powfectUser"
                        )
                    );


                /* =========================
                   CHECK LOGIN
                ========================= */

                const isLoggedIn =
                    localStorage.getItem(
                        "powfectLoggedIn"
                    );


                /* =========================
                   IF USER IS NOT LOGGED IN
                ========================= */

                if (
                    !user ||
                    isLoggedIn !== "true"
                ) {

                    userProfile.style.display =
                        "none";

                    return;
                }


                /* =========================
                   SHOW USER DETAILS
                ========================= */

                profileName.textContent =
                    user.name;


                userName.textContent =
                    user.name;


                userEmail.textContent =
                    user.email;


                userMobile.textContent =
                    user.mobile;


                userAddress.textContent =
                    user.address;


                /* =========================
                   OPEN / CLOSE PROFILE
                ========================= */

                profileBtn.addEventListener(
                    "click",
                    function (event) {

                        event.stopPropagation();

                        profileDropdown.classList.toggle(
                            "show"
                        );

                        profileBtn.classList.toggle(
                            "open"
                        );

                    }
                );


                /* =========================
                   CLOSE OUTSIDE CLICK
                ========================= */

                document.addEventListener(
                    "click",
                    function (event) {

                        if (
                            !profileDropdown.contains(
                                event.target
                            ) &&
                            !profileBtn.contains(
                                event.target
                            )
                        ) {

                            profileDropdown.classList.remove(
                                "show"
                            );

                            profileBtn.classList.remove(
                                "open"
                            );

                        }

                    }
                );


                /* =========================
                   LOGOUT
                ========================= */

                logoutBtn.addEventListener(
                    "click",
                    function () {

                        localStorage.removeItem(
                            "powfectLoggedIn"
                        );


                        window.location.href =
                            "customer-login.html";

                    }
                );


            }
        );

    </script>


</body>

</html>
