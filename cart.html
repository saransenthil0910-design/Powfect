
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Powfect</title>


    <!-- FONT AWESOME -->

    <script
        src="https://kit.fontawesome.com/d1f9284067.js"
        crossorigin="anonymous"
    ></script>


    <style>

        /* =========================
           GLOBAL
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family: Arial, sans-serif;
            background-color: #f8f0df;
            color: #333;
            min-height: 100vh;
            overflow-x: hidden;
        }


        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            width: 100%;
            min-height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 25px;

            padding: 15px 5%;

            background-color: #fffaf0;

            box-shadow:
                2px 2px 20px
                rgba(185, 87, 45, 0.35);

            position: sticky;
            top: 0;
            z-index: 1000;
        }


        /* =========================
           LOGO AREA
        ========================== */

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        /* =========================
           MENU BUTTON
        ========================== */

        .menu-toggle {
            display: none;

            border: none;
            background: transparent;

            color: #b9572d;

            font-size: 24px;

            padding: 5px;

            cursor: pointer;

            line-height: 1;
        }


        /* =========================
           LOGO
        ========================== */

        .logo {
            display: flex;
            align-items: center;

            gap: 8px;

            font-size: 28px;
            font-weight: bold;

            color: #b9572d;

            white-space: nowrap;
        }


        .logo span:first-child {
            font-size: 30px;
        }


        /* =========================
           NAV LINKS
        ========================== */

        .nav-links {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 30px;

            list-style: none;
        }


        .nav-links a {
            position: relative;

            display: inline-block;

            text-decoration: none;

            color: #333;

            font-size: 16px;
            font-weight: 600;

            padding: 8px 0;

            white-space: nowrap;
        }


        .nav-links a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 0;
            height: 2px;

            background-color: #b9572d;

            transition:
                width 0.3s ease;
        }


        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }


        /* =========================
           CART ICON
        ========================== */

        .cart-link {
            position: relative;

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            text-decoration: none;

            color: #b9572d;

            flex-shrink: 0;

            transition: 0.3s ease;
        }


        .cart-link:hover {
            color: #8f3f1f;

            transform:
                translateY(-2px);
        }


        .cart-link i {
            font-size: 25px;
        }


        /* =========================
           CART COUNT
        ========================== */

        .cart-count {
            position: absolute;

            top: -5px;
            right: -5px;

            min-width: 20px;
            height: 20px;

            padding: 0 5px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background-color: #b9572d;

            color: white;

            font-size: 11px;
            font-weight: bold;

            border:
                2px solid #fffaf0;

            line-height: 1;
        }


        /* =========================
           CART PAGE
        ========================== */

        .cart-page {
            width: 90%;
            max-width: 1200px;

            margin: 50px auto;
        }


        /* =========================
           CART TITLE
        ========================== */

        .cart-title {
            text-align: center;

            margin-bottom: 35px;
        }


        .cart-title h1 {
            font-size: 38px;

            color: #b9572d;
        }


        .cart-title p {
            margin-top: 8px;

            color: #777;
        }


        /* =========================
           CART LAYOUT
        ========================== */

        .cart-layout {
            display: grid;

            grid-template-columns:
                1fr 330px;

            gap: 30px;

            align-items: start;
        }


        /* =========================
           CART ITEMS
        ========================== */

        .cart-items {
            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        .cart-item {
            display: flex;

            align-items: center;

            gap: 20px;

            background: #fff;

            padding: 18px;

            border-radius: 15px;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.08);
        }


        .cart-item img {
            width: 110px;
            height: 110px;

            object-fit: cover;

            border-radius: 12px;
        }


        .cart-item-details {
            flex: 1;
        }


        .cart-item-details h2 {
            color: #b9572d;

            font-size: 21px;

            margin-bottom: 7px;
        }


        .cart-item-price {
            color: #8a5735;

            font-weight: bold;

            font-size: 18px;
        }


        /* =========================
           QUANTITY
        ========================== */

        .quantity-box {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 12px;
        }


        .quantity-box button {
            width: 32px;
            height: 32px;

            border: none;

            border-radius: 7px;

            background: #b9572d;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .quantity-box button:hover {
            background: #8f3f1f;
        }


        .quantity-number {
            min-width: 25px;

            text-align: center;

            font-weight: bold;
        }


        /* =========================
           ITEM TOTAL
        ========================== */

        .item-total {
            font-weight: bold;

            font-size: 18px;

            color: #b9572d;

            min-width: 90px;

            text-align: right;
        }


        /* =========================
           REMOVE BUTTON
        ========================== */

        .remove-btn {
            border: none;

            background: transparent;

            color: #c0392b;

            cursor: pointer;

            font-size: 14px;

            margin-top: 8px;
        }


        .remove-btn:hover {
            text-decoration: underline;
        }


        /* =========================
           CART SUMMARY
        ========================== */

        .cart-summary {
            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 95px;
        }


        .cart-summary h2 {
            color: #b9572d;

            margin-bottom: 20px;
        }


        .summary-row {
            display: flex;

            justify-content: space-between;

            margin: 14px 0;

            color: #555;
        }


        .summary-total {
            border-top:
                1px solid #ddd;

            padding-top: 18px;

            font-size: 21px;

            font-weight: bold;

            color: #b9572d;
        }


        /* =========================
           CHECKOUT BUTTON
        ========================== */

        .checkout-btn {
            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #b9572d;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s ease;
        }


        .checkout-btn:hover {
            background: #8f3f1f;

            transform:
                translateY(-2px);
        }


        /* =========================
           EMPTY CART
        ========================== */

        .empty-cart {
            text-align: center;

            padding: 60px 20px;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.08);
        }


        .empty-cart i {
            font-size: 60px;

            color: #b9572d;

            margin-bottom: 20px;
        }


        .empty-cart h2 {
            color: #b9572d;

            margin-bottom: 10px;
        }


        .empty-cart p {
            color: #777;
        }


        .continue-shopping {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 22px;

            background: #b9572d;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            transition: 0.3s ease;
        }


        .continue-shopping:hover {
            background: #8f3f1f;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 800px) {

            .navbar {
                min-height: 65px;

                padding:
                    12px 5%;

                gap: 0;
            }


            /* =====================
               LOGO AREA
            ====================== */

            .logo-area {
                display: flex;

                align-items: center;

                gap: 10px;
            }


            /* =====================
               MENU BUTTON
            ====================== */

            .menu-toggle {
                display: block;

                flex-shrink: 0;

                font-size: 24px;

                color: #b9572d;
            }


            /* =====================
               LOGO
            ====================== */

            .logo {
                font-size: 21px;

                gap: 5px;
            }


            .logo span:first-child {
                font-size: 23px;
            }


            /* =====================
               MOBILE NAV
            ====================== */

            .nav-links {
                position: absolute;

                top: 65px;

                left: 0;

                width: 220px;

                background: #fffaf0;

                display: none;

                flex-direction: column;

                align-items: flex-start;

                justify-content: flex-start;

                gap: 0;

                padding:
                    18px 20px;

                box-shadow:
                    4px 8px 18px
                    rgba(0, 0, 0, 0.15);

                border-radius:
                    0 0 12px 0;
            }


            .nav-links.active {
                display: flex;
            }


            .nav-links li {
                width: 100%;
            }


            .nav-links a {
                width: 100%;

                display: block;

                padding:
                    12px 5px;

                font-size: 15px;
            }


            /* =====================
               CART ICON
            ====================== */

            .cart-link {
                margin-left: auto;

                width: 42px;

                height: 42px;
            }


            .cart-link i {
                font-size: 25px;
            }


            .cart-count {
                top: -4px;

                right: -4px;
            }


            /* =====================
               CART PAGE
            ====================== */

            .cart-page {
                width: 92%;

                margin:
                    35px auto;
            }


            .cart-title {
                margin-bottom: 25px;
            }


            .cart-title h1 {
                font-size: 30px;
            }


            .cart-title p {
                font-size: 14px;

                line-height: 1.5;
            }


            /* =====================
               CART LAYOUT
            ====================== */

            .cart-layout {
                grid-template-columns: 1fr;

                gap: 20px;
            }


            /* =====================
               CART ITEM
            ====================== */

            .cart-item {
                display: grid;

                grid-template-columns:
                    85px 1fr;

                gap: 12px;

                padding: 14px;
            }


            .cart-item img {
                width: 85px;
                height: 85px;

                grid-row: span 2;
            }


            .cart-item-details h2 {
                font-size: 17px;
            }


            .cart-item-price {
                font-size: 16px;
            }


            .quantity-box {
                margin-top: 10px;

                gap: 8px;
            }


            .quantity-box button {
                width: 30px;

                height: 30px;
            }


            .item-total {
                grid-column: 2;

                text-align: left;

                min-width: auto;

                font-size: 17px;
            }


            .remove-btn {
                font-size: 13px;
            }


            /* =====================
               SUMMARY
            ====================== */

            .cart-summary {
                position: static;

                padding: 20px;
            }


            .summary-total {
                font-size: 19px;
            }


            .checkout-btn {
                font-size: 15px;
            }


            /* =====================
               EMPTY CART
            ====================== */

            .empty-cart {
                padding:
                    50px 15px;
            }


            .empty-cart i {
                font-size: 50px;
            }

        }


        /* =========================
           SMALL MOBILE
        ========================== */

        @media (max-width: 400px) {

            .navbar {
                padding:
                    12px 4%;
            }


            .logo {
                font-size: 19px;
            }


            .logo span:first-child {
                font-size: 21px;
            }


            .menu-toggle {
                font-size: 22px;
            }


            .cart-link {
                width: 40px;

                height: 40px;
            }


            .cart-link i {
                font-size: 23px;
            }


            .cart-count {
                min-width: 19px;

                height: 19px;

                font-size: 10px;
            }


            .cart-item {
                grid-template-columns:
                    75px 1fr;

                padding: 12px;

                gap: 10px;
            }


            .cart-item img {
                width: 75px;

                height: 75px;
            }


            .cart-item-details h2 {
                font-size: 15px;
            }


            .cart-item-price {
                font-size: 14px;
            }


            .quantity-box button {
                width: 28px;

                height: 28px;

                font-size: 16px;
            }


            .quantity-number {
                min-width: 20px;
            }


            .item-total {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">


        <!-- LOGO AREA -->

        <div class="logo-area">


            <!-- MOBILE MENU -->

            <button
                type="button"
                class="menu-toggle"
                id="menuToggle"
                aria-label="Open Menu"
            >

                <i class="fa-solid fa-bars"></i>

            </button>


            <!-- LOGO -->

            <div class="logo">

                <span>🐾</span>

                <span>
                    Powfect
                </span>

            </div>

        </div>


        <!-- NAV LINKS -->

        <ul
            class="nav-links"
            id="navLinks"
        >

            <li>

                <a href="home.html">
                    Home
                </a>

            </li>


            <li>

                <a href="products.html">
                    Products
                </a>

            </li>


            <li>

                <a href="Blog.html">
                    Blogs
                </a>

            </li>


            <li>

                <a href="about.html">
                    About Us
                </a>

            </li>


            <li>

                <a href="contact.html">
                    Contact
                </a>

            </li>

        </ul>


        <!-- CART ICON ONLY -->

        <a
            href="cart.html"
            class="cart-link"
        >

            <i
                class="fa-solid fa-cart-shopping"
            ></i>


            <span
                class="cart-count"
                id="cartCount"
            >
                0
            </span>

        </a>

    </nav>


    <!-- =========================
         CART PAGE
    ========================== -->

    <main class="cart-page">


        <section class="cart-title">

            <h1>
                Your Shopping Cart
            </h1>


            <p>
                Review your pet products before checkout
            </p>

        </section>


        <div id="cartContent">

            <!-- JavaScript will add cart products here -->

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="cart.js"></script>


</body>

</html>
